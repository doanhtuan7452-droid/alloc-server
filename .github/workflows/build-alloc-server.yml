name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore ./AllocServer.sln
      
    - name: Build
      run: dotnet build ./AllocServer.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test ./AllocServer.sln --configuration Release --no-build --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    
    # Cấp quyền cho GitHub Actions ghi Image vào kho
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    # Bước 1: Đăng nhập vào GitHub Container Registry (GHCR)
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    # Bước 2: Build và Đẩy Image lên GHCR
    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/AllocServer/Dockerfile
        push: true
        # Đặt tên cố định cho Image để Azure dễ dàng tìm thấy
        tags: ghcr.io/${{ github.repository_owner }}/alloc-server:latest
